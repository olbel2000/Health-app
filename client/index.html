<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4ECDC4" />
  <title>🏝️ Lingo Island - Learn Languages with Magic!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* PlayCanvas Canvas */
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Loading Screen - Magic Theme */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease-out;
      overflow: hidden;
    }

    #loading-screen::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 80%, rgba(78, 205, 196, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 40% 40%, rgba(240, 147, 251, 0.1) 0%, transparent 40%);
      animation: aurora 15s ease-in-out infinite;
    }

    @keyframes aurora {
      0%, 100% { transform: translate(-10%, -10%) rotate(0deg); }
      50% { transform: translate(10%, 10%) rotate(180deg); }
    }

    /* Floating particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
      border-radius: 50%;
      animation: float-up 4s ease-in-out infinite;
    }

    @keyframes float-up {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4ECDC4, #44A08D, #667eea, #f093fb);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 3s ease infinite;
      text-shadow: 0 0 40px rgba(78, 205, 196, 0.5);
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .loading-subtitle {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 1;
    }

    .loading-spinner {
      width: 80px;
      height: 80px;
      position: relative;
      z-index: 1;
    }

    .loading-spinner::before,
    .loading-spinner::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid transparent;
    }

    .loading-spinner::before {
      border-top-color: #4ECDC4;
      border-right-color: #4ECDC4;
      animation: spin 1.2s linear infinite;
    }

    .loading-spinner::after {
      border-bottom-color: #667eea;
      border-left-color: #f093fb;
      animation: spin 1.2s linear infinite reverse;
      animation-delay: 0.2s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-progress {
      margin-top: 2rem;
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      position: relative;
      z-index: 1;
    }

    /* Game UI Overlay */
    #game-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    #game-ui > * {
      pointer-events: auto;
    }

    /* Top Bar - Glassmorphism */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
    }

    .score-display {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .score-icon {
      font-size: 1.4rem;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .score-display:first-child .score-icon { color: #FFD700; }
    .score-display:last-child .score-icon { color: #FF6B6B; }

    /* Word Display - Floating Card */
    .word-display {
      position: absolute;
      bottom: 9rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      padding: 1.2rem 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3),
                  0 0 0 1px rgba(255,255,255,0.1),
                  inset 0 1px 0 rgba(255,255,255,0.5);
      text-align: center;
      min-width: 220px;
      animation: float-gentle 3s ease-in-out infinite;
    }

    @keyframes float-gentle {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }

    .word-display .word {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .word-display .hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.4rem;
      font-weight: 500;
    }

    /* Action Buttons - Neon Style */
    .action-buttons {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
    }

    .action-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.8rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .action-btn:hover {
      transform: scale(1.15) translateY(-5px);
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .action-btn.mic {
      background: linear-gradient(135deg, #FF6B6B, #ee5a24);
      color: white;
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4),
                  0 0 20px rgba(255, 107, 107, 0.2);
    }

    .action-btn.mic:hover {
      box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5),
                  0 0 40px rgba(255, 107, 107, 0.3);
    }

    .action-btn.hint {
      background: linear-gradient(135deg, #4ECDC4, #44A08D);
      color: white;
      box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4),
                  0 0 20px rgba(78, 205, 196, 0.2);
    }

    .action-btn.hint:hover {
      box-shadow: 0 15px 40px rgba(78, 205, 196, 0.5),
                  0 0 40px rgba(78, 205, 196, 0.3);
    }

    .action-btn.skip {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4),
                  0 0 20px rgba(102, 126, 234, 0.2);
    }

    .action-btn.skip:hover {
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5),
                  0 0 40px rgba(102, 126, 234, 0.3);
    }

    /* Character Selection - Compact Floating Design */
    .character-select {
      position: absolute;
      bottom: 10rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 1.2rem 1.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3),
                  0 0 0 1px rgba(255,255,255,0.2);
      text-align: center;
      display: none;
      animation: modal-appear 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modal-appear {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .character-select.active {
      display: block;
    }

    .character-select h2 {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .character-options {
      display: flex;
      gap: 1rem;
    }

    .character-card {
      width: 110px;
      padding: 1rem 0.8rem;
      border-radius: 1.2rem;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      position: relative;
      overflow: hidden;
    }

    .character-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.5));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .character-card:hover {
      transform: translateY(-5px) scale(1.05);
      border-color: transparent;
    }

    .character-card:hover::before {
      opacity: 1;
    }

    .character-card.ladybug:hover {
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
      border-color: #FF6B6B;
    }

    .character-card.harry:hover {
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      border-color: #667eea;
    }

    .character-card .avatar {
      width: 55px;
      height: 55px;
      margin: 0 auto 0.6rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .character-card.ladybug .avatar {
      background: linear-gradient(135deg, #FF6B6B, #ee5a24);
      animation: pulse-ladybug 2s ease-in-out infinite;
    }

    .character-card.harry .avatar {
      background: linear-gradient(135deg, #667eea, #764ba2);
      animation: pulse-harry 2s ease-in-out infinite;
    }

    @keyframes pulse-ladybug {
      0%, 100% { box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3); }
      50% { box-shadow: 0 5px 25px rgba(255, 107, 107, 0.6); }
    }

    @keyframes pulse-harry {
      0%, 100% { box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); }
      50% { box-shadow: 0 5px 25px rgba(102, 126, 234, 0.6); }
    }

    .character-card .name {
      font-weight: 700;
      font-size: 0.85rem;
      color: #1a1a2e;
      margin-bottom: 0.2rem;
      position: relative;
      z-index: 1;
    }

    .character-card .role {
      font-size: 0.7rem;
      color: #666;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .loading-title { font-size: 2.5rem; }
      .character-select { 
        bottom: 8rem;
        padding: 1rem;
      }
      .character-options { gap: 0.8rem; }
      .character-card { width: 95px; padding: 0.8rem 0.6rem; }
      .character-card .avatar { width: 45px; height: 45px; font-size: 1.5rem; }
      .character-card .name { font-size: 0.75rem; }
      .character-card .role { font-size: 0.6rem; }
      .action-btn { width: 60px; height: 60px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- PlayCanvas Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="particles" id="particles"></div>
      <div class="loading-title">🏝️ Lingo Island</div>
      <div class="loading-subtitle">✨ Preparing your magical adventure...</div>
      <div class="loading-spinner"></div>
      <div class="loading-progress">Loading assets...</div>
    </div>
    <script>
      // Generate floating particles
      const particles = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 4 + 's';
        particle.style.animationDuration = (3 + Math.random() * 3) + 's';
        particles.appendChild(particle);
      }
    </script>

    <!-- Game UI Overlay -->
    <div id="game-ui" style="display: none;">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="score-display">
          <span class="score-icon">⭐</span>
          <span id="score-value">0</span>
        </div>
        <div class="score-display">
          <span class="score-icon">🔥</span>
          <span id="streak-value">0</span>
        </div>
      </div>

      <!-- Word Display -->
      <div class="word-display" id="word-display" style="display: none;">
        <div class="word" id="current-word">APPLE</div>
        <div class="hint" id="current-hint">A red fruit</div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="action-btn hint" id="btn-hint" title="Get Hint">💡</button>
        <button class="action-btn mic" id="btn-mic" title="Speak">🎤</button>
        <button class="action-btn skip" id="btn-skip" title="Skip">⏭️</button>
      </div>

      <!-- Character Selection Modal -->
      <div class="character-select" id="character-select">
        <h2>Choose Your Character!</h2>
        <div class="character-options">
          <div class="character-card ladybug" data-character="ladybug">
            <div class="avatar">🐞</div>
            <div class="name">Nano Ladybug</div>
            <div class="role">Speed Runner</div>
          </div>
          <div class="character-card harry" data-character="harry">
            <div class="avatar">🧙</div>
            <div class="name">Nano Harry</div>
            <div class="role">Magic Tracer</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
